plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kausar.scream'
    compileSdk 36
    defaultConfig {
        applicationId 'com.kausar.scream'
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            def kp = System.getenv('KEYSTORE_PASSWORD')
            def ka = System.getenv('KEY_ALIAS')
            def pp = System.getenv('KEY_PASSWORD')
            if (ks && kp && ka && pp) {
                storeFile file(ks); storePassword kp; keyAlias ka; keyPassword pp
            }
        }
    }
    // Debug & release pakai keystore SAMA agar update APK tidak bentrok tanda tangan
    if (System.getenv('KEYSTORE_FILE') && System.getenv('KEYSTORE_PASSWORD') && System.getenv('KEY_ALIAS') && System.getenv('KEY_PASSWORD')) {
        buildTypes.release.signingConfig signingConfigs.release
        buildTypes.debug.signingConfig signingConfigs.release
    }

    splits {
        abi {
            enable false
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true; compose false }
    
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packaging.resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
